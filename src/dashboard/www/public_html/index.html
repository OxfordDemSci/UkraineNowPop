    <style>
        option:disabled {
            color: #999;
        }

        #controlPanel_DateTimeID .ui-slider-pips .ui-slider-label{
            width: 6em;
            left: 0%;
            margin-left: -2em
        }

        #controlPanel_DateTimeID .ui-slider-pips .ui-slider-tip, .ui-slider-float .ui-slider-tip-label {
            width: 6em;
            margin-left: -2.3em;
            left: 0%;
        }

        #controlPanel_DateTimeID .ui-slider-pips .ui-slider-pip {
            font-size: 0.9em;
        }

        .slider_age_selections .ui-slider-tip {
            visibility: visible;
            opacity: 1;
            width: 2em;
            top: -30px;
            margin-left: -1em;
            z-index: 1000 !important;
        }

        .control_label {
            font-size: 1.1em;
            font-weight: bolder;
            line-height: 1em;
            color: rgba(0, 0, 0, .6);
        }

        #firstloader {
            position: fixed;
            left: 0px;
            top: 0px;
            width: 100%;
            height: 100%;
            z-index: 19999!important;
            background: url('../img/firstloader_pixels_BW.gif') 50% 30% no-repeat rgba(245,245,245,0.9);
            background-size: 45px 45px;
        }

        #legend_PopMap_info {
            line-height: 1.2rem;
            color: #333333;
            font-family: 'Open Sans', Helvetica, sans-serif;
            padding: 2px 4px;
            background: white;
            background: rgba(255,255,255,0.91);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            float: left;
            font-size: 0.90rem;
            /*    z-index: 8000 !important;*/
        }

        #infoboxPopMapID {
            height: 60px;
            width: 260px;
            background-color: #fff;
            border-left: 1px solid #ccc; 
            background: white;
            background: rgba(255,255,255,0.85);
            box-shadow: 0 0 10px rgba(0,0,0,0.2); 
            opacity: 0.95;
            filter: alpha(opacity=10);
        }

        #Copyright_info {
            background-color: #fff;
            border-left: 1px solid #ccc; 
            background: white;
            background: rgba(255,255,255,0.55);
            box-shadow: 0 0 1px rgba(0,0,0,0.2); 
            opacity: 0.90;
            filter: alpha(opacity=10);
        }        
        

        .winBar_top {
            background-color: white;
            box-shadow: 0 0 2px rgba(0,0,0,0.2);
        } 
        </style>        
    </head>

    <body>
    <div id="firstloader"></div>    
        <header>
<nav class="navbar fixed-top bg-light">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">Ukraine Population</a>
    <button class="btn btn-labeled btn-light btn-sm" type="button" id="btnSettings">
        <span class="btn-label"><i class="fas fa-cog"></i></span> 
    </button>    
  </div>
</nav>            
        </header> 

        <div id="map" style=""></div>
        
        <!-------------------------------------------------------------------------------------------------------->
        <!--  Main Control Panel Start -->
        <!-------------------------------------------------------------------------------------------------------->
        <div id="controlPanel_ControlsID" class="" style="margin-top: 60px">
            <div class="container-fluid p-0">
                <div class="row m-0">
                    <div class="col-12 align-items-center d-flex justify-content-between p-0 winBar_top">
                        <div class="float-start ">
                            <span style="padding-left:4px"></span>
                        </div> 
                        <div class="float-end">
                            <a type="button" class="btn btn-labeled btn-light btn-sm" id="btnQuestionPanel_Controls" style="color: black" 
                               data-toggle="tooltip" data-placement="top" title="Further information">
                                <span class="btn-label"><i class="fas fa-question-circle"></i></span> 
                            </a>
                        </div>            
                    </div>
                </div>     
                <div class="row m-0">
                    <div class="col-12">

                        <div class="container-fluid pt-2">
                            <div class="row">
                                <div class="col-6">
                                    <div class="form-group mb-3">
                                        <label class="control_label mb-1">Geo</label>
                                        <select class="form-select form-select-sm" id="idSelectGeoLevel" style="width: 80px">
                                        </select>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-group mb-3">
                                        <label class="control_label mb-1">Sex</label>
                                        <select class="form-select form-select-sm" id="idSelectSex"  style="width: 80px">
                                            <option value="Both" selected>Both</option>
                                            <option value="Female">Female</option>
                                            <option value="Male" >Male</option>
                                        </select>
                                    </div>                            
                                </div>
                            </div>
                        </div>                        

                    </div>
                </div>

                <div class="row m-0">
                    <div class="col-12">

                        <div class="container-fluid">      
                            <div class="row align-items-center">
                                <div class="pt-1 mb-3">
                                    <label  class="control_label" style="">Age</label> 
                                </div>
                            </div>                     
                            <div class="row align-items-center">
                                <div class="p-4">
                                    <div class="slider_age_selections"></div> 
                                </div>
                            </div>  
                        </div> 

                    </div>
                </div> 

                <div class="row m-0">
                    <div class="col-sm-12">
                        <div class="container-fluid">      
                            <div class="row align-items-center">
                                <div class="pt-0 ">
                                    <label class="control_label mb-1">Country total:</label>
                                    <label class="control_label mb-1" id="cntrlTotalLabel"></label>
                                </div>
                            </div>                     
                        </div>                         
                    </div>
                    
                    <div class="col-sm-12 pt-1" style="background-color: #fff; visibility: hidden" id="adminTotalInfoBox">
                        <div class="container-fluid">      
                            <div class="row align-items-center">
                                <div class="col-sm-12 p-0">
                                    
                                <table class="table table-sm" style="">
                                    <tr style="">
                                    <td style="border-bottom-width:0px; width: 20px">                                            
                                            <span class=""
                                                id="btnResetSelectedAdmin"
                                                style="cursor: pointer;font-size: 0.8rem"
                                                data-bs-toggle="tooltip"
                                                data-bs-placement="top"
                                                data-bs-title="Reset Funder">
                                                <i class="fas fa-minus-circle"></i>
                                            </span></td>
                                    <td style="border-bottom-width:0px; "><label class="" id="adminTotalLabel"></label></td>
                                    </tr>
                                    <tr style="">
                                        <td style="border-bottom-width:0px; width: 20px;"></td>
                                        <td style="border-bottom-width:0px; "><label id="adminNameLabel"></label></td>
                                    </tr>                                    
                                </table>    
                                    
                                </div>
                            </div>
                        </div>                         
                    </div>                    
<!--                    <div class="col-sm-12 pt-2">
                        <div class="container-fluid">      
                            <div class="row align-items-center">
                                <div class="col-sm-2">2</div>
                                <div class="col-sm-10"><label class="" id="adminTotalLabel"></label></div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-sm-2"></div>
                                <div class="col-sm-10 pt-1"><label class="" id="adminNameLabel"></label></div>
                            </div>                            
                        </div>                         
                    </div>                    -->
                </div>

            </div>
        </div>        
        <!-------------------------------------------------------------------------------------------------------->
        <!--  Main Control Panel End -->
        <!-------------------------------------------------------------------------------------------------------->              
        
 
        <!-------------------------------------------------------------------------------------------------------->
        <!--  Probability Panel Start -->
        <!-------------------------------------------------------------------------------------------------------->
        <div id="controlPanel_ProbabilityID" style="margin-top: 60px">
            <div class="container-fluid p-0">
                <div class="row m-0">
                    <div class="col-12 align-items-center d-flex justify-content-between p-0 winBar_top">
                        <div class="float-start ">
                            <span style="padding-left:4px">Probability</span>
                        </div> 
                        <div class="float-end">
                            <a type="button" class="btn btn-labeled btn-light btn-sm" id="btnQuestionPanel_Probability" style="color: black" 
                               data-toggle="tooltip" data-placement="top" title="Further information">
                                <span class="btn-label"><i class="fas fa-question-circle"></i></span> 
                            </a>
                        </div>            
                    </div>
                </div>     
                <div class="row m-0">
                    <div class="col-12 d-flex flex-column justify-content-between align-items-center p-0">
                        <div id="plotProbability" style="height: 230px;width: 230px"></div>
                    </div>
                </div>
            </div>
        </div>        
        <!-------------------------------------------------------------------------------------------------------->
        <!--  Probability Panel End -->
        <!-------------------------------------------------------------------------------------------------------->              
        

        <!-------------------------------------------------------------------------------------------------------->
        <!--  Demographic structure of a population Panel Start -->
        <!-------------------------------------------------------------------------------------------------------->
        <div id="controlPanel_PopulationPyramidID" class="mt-4">
            <div class="container-fluid p-0">
                <div class="row m-0">
                    <div class="col-12 align-items-center d-flex justify-content-between p-0 winBar_top">
                        <div class="float-start ">
                            <span style="padding-left:4px">Demographic structure of population</span>
                        </div> 
                        <div class="float-end">
                            <a type="button" class="btn btn-labeled btn-light btn-sm" id="btnQuestion_PopulationPyramid" style="color: black" 
                               data-toggle="tooltip" data-placement="top" title="Further information">
                                <span class="btn-label"><i class="fas fa-question-circle"></i></span> 
                            </a>
                        </div>            
                    </div>
                </div>     
                <div class="row m-0">
                    <div class="col-12 d-flex flex-column justify-content-between align-items-center p-0">
                        <div id="plotPopulationPyramid" style="height: 230px;width: 230px"></div>
                    </div>
                </div>
            </div>
        </div>        
        <!-------------------------------------------------------------------------------------------------------->
        <!--  Demographic structure of a population Panel End -->
        <!-------------------------------------------------------------------------------------------------------->       
        
        
        <!-------------------------------------------------------------------------------------------------------->
        <!--  Migration Flow panel Start -->
        <!-------------------------------------------------------------------------------------------------------->       
        <div id="controlPanel_ChordDiagramID" class="mt-4">
            <div class="container-fluid p-0">
                <div class="row m-0">
                    <div class="col-12 align-items-center d-flex justify-content-between p-0 winBar_top">
                        <div class="float-start ">
                            <span style="padding-left:4px">Migration flow</span>
                        </div> 
                        <div class="float-end">
                            <a type="button" class="btn btn-labeled btn-light btn-sm" id="btnQuestion_ChordDiagrams" style="color: black" 
                               data-toggle="tooltip" data-placement="top" title="Further information">
                                <span class="btn-label"><i class="fas fa-question-circle"></i></span> 
                            </a>
                            <a type="button" class="btn btn-labeled btn-light btn-sm" id="btnExpand_ChordDiagrams" style="color: black" 
                               data-toggle="tooltip" data-placement="top" title="Maximize Chord Diagram">
                                <span class="btn-label"><i class="fas fa-window-maximize"></i></span> 
                            </a>                
                        </div>            
                    </div>
                </div>     
                <div class="row">
                    <div class="col-12 d-flex flex-column justify-content-between align-items-center  p-0">
                        <div id="plotChordDiagram" style="height: 220px;width: 220px"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 d-flex flex-column justify-content-between align-items-center mt-3  p-0">
                        <div class="btn-group" id="plotChordDiagramDisplaySelect" role="group" aria-label="Basic radio toggle button group">

                            <input type="radio" class="btn-check" name="btnradio" id="btnradioPlotChordDiagramCount" autocomplete="off" checked>
                            <label class="btn btn-sm btn-outline-secondary" for="btnradioPlotChordDiagramCount">&nbsp;&nbsp; Counts &nbsp;&nbsp;</label>

                            <input type="radio" class="btn-check" name="btnradio" id="btnradioPlotChordDiagramProbability" autocomplete="off">
                            <label class="btn btn-sm btn-outline-secondary" for="btnradioPlotChordDiagramProbability">Probability</label>

                        </div>
                    </div>
                </div>    
            </div>
        </div>        
        <!-------------------------------------------------------------------------------------------------------->
        <!--  Migration Flow panel End -->
        <!-------------------------------------------------------------------------------------------------------->

     
        
        <div id="controlPanel_DateTimeID"  style="padding-left: 3em;padding-right: 3em">
            <div>
                <label class="control_label mb-3 mt-3">Date</label>
                <div class="Date-slider" ></div>
           </div>
       </div> 
           

        <!--  Modal  -->
        <div class="modal fade"  data-backdrop="false"  id="idMdPlotChordDiagram" tabindex="-1"  aria-labelledby="ModalChordDiagram" style="opacity: 0.90;z-index: 2200;">
            <div class="modal-dialog modal-lg  modal-dialog-centered"  role="document" >
                <div class="modal-content">
                    <div class="modal-header m-0 p-2" >
                        <label id="idMdPlotChordDiagram_lable">Count</label><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body" >
                        <div class="container">

                            <div style="width: 100%;" class=" d-flex justify-content-center">
                                <div id="plotChordDiagram_lg" style="height: 500px;width: 500px"></div>      
                            </div> 

                            <div class="form-check form-switch float-end">
                                <input class="form-check-input" type="checkbox" id="SwitchAnimationMigrationPlot_LG" checked>
                                <label class="form-check-label" for="SwitchAnimationMigrationPlot_LG">Animation</label>
                            </div>

                        </div>

                    </div>
                </div>
            </div> 
        </div> 
        <!--  Modal END  -->
        
<!--  Modal Settings -->
<div class="modal fade " data-backdrop="false" id="idMdSettings" tabindex="-1" aria-labelledby="ModalSettings"
     style="opacity: 0.95;z-index: 2200">
    <div class="modal-dialog modal-dialog-centered" role="document" id="idModalSettings-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="ModalSettingsLabel">Settings</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div class="container">

                    <div class="row mt-2">

                        <div class="col-sm-10">
                            <label class="form-check-label label_settings" for="numberFundersLimit">
                                <strong>Migration</strong>
                            </label>
                            <br><small>Limit the number of results</small>
                        </div>

                        <div class="col-sm-2">
                            <select id="numberMigrationLimit" class="form-select form-select-sm"
                                    style="padding-top: 0rem;padding-bottom: 0rem;">
                                <option value="5" >5</option>
                                <option value="10" selected>10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                                <option value="25">25</option>
                            </select>
                        </div>

                    </div>

                    <div class="row">
                        <div class="col-sm-12">
                            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-2 pb-2 mb-1 border-bottom"></div>
                        </div>
                    </div>

                   <div class="row">

                        <div class="col-sm-10">
                            <label class="form-check-label label_settings" for="chCountryLabels">
                                <strong>Population Map</strong>
                            </label>
                            <br><small>Show country name labels</small>
                        </div>

                        <div class="col-sm-2">
                            <div class="text-center">
                                <input class="form-check-input" type="checkbox" id="chCountryLabels" checked>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

            <div class="modal-footer p-1">
                <button type="button" class="btn btn-secondary btn-sm mr-2" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
<!-- end  modals Settings -->
