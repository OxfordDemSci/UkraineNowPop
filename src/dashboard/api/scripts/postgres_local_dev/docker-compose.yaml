version: '3'

services:
  pop_now_postgres:
    container_name: oxford_pop_now_dashboard_db
    image: postgis/postgis:15-3.4
    env_file: .env
    networks:
      - pop_now_net
    volumes:
      - ./init-scripts/:/docker-entrypoint-initdb.d
      - pop_now_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  pop_now_memcached:
    container_name: pop_now_cache
    image: memcached:latest
    networks:
      - pop_now_net
    ports:
      - "11211:11211"
    restart: unless-stopped

networks:
  pop_now_net:

volumes:
  pop_now_db_data:
