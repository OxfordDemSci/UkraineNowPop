version: '3'

services:
  pop_now_postgres:
    container_name: oxford_pop_now_dashboard_db
    image: postgres:13.11-bullseye
    env_file: .env
    networks:
      - pop_now_net
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped

  pop_now_memcached:
    container_name: pop_now_cache
    image: memcached:latest
    networks:
      - pop_now_net
    ports:
      - "11211:11211"
    restart: unless-stopped

networks:
  pop_now_net:
