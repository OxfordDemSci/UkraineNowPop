version: '3'

services:
  now_pop_postgres:
    container_name: oxford_now_pop_dashboard_db
    build: .
    env_file: .env
    networks:
      - now_pop_net
    volumes:
      #- ./init-scripts/:/docker-entrypoint-initdb.d
      - dashboard_now_pop_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  now_pop_memcached:
    container_name: now_pop_cache
    image: memcached:latest
    networks:
      - now_pop_net
    ports:
      - "11211:11211"
    restart: unless-stopped

networks:
  now_pop_net:

volumes:
  dashboard_now_pop_db_data:
    external: true
