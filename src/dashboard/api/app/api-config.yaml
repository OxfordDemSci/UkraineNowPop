openapi: 3.0.0
info:
  title: "University of Oxford Now Pop Dashboard"
  description: "REST API powering the Now Pop Dashboard - Nowcasting Ukraine's population subnationally every day: Bayesian methods and interactive dashboard"
  version: "1.0.0"
servers:
  - url: "/api"
paths:
  
  /login:
    post:
      summary: User login
      x-swagger-router-controller: app.endpoints
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          description: Unauthorized
  /get_countries:
    get:
      x-swagger-router-controller: app.endpoints
      operationId: "get_countries"
      tags:
        - "Countries"
      summary: "Get all valid countries, their centroid and bounding box"
      responses:
        "200":
          description: "Successfully retrieved countries"
        "400":
          description: "Invalid request parameters"
        "401":
          description: "Unauthorized"
        "500":
          description: "Internal server error"
  /init:
      get:
        x-swagger-router-controller: app.endpoints
        operationId: "init"
        parameters:
          - name: "country"
            required: true
            in: "query"
            schema:
              type: "string"
            description: "Country code in ISO 3166-1 alpha-3 format"
        tags:
          - "Initialization"
        summary: "Initialisation endpoint to set up app. Returns age groups dates in which data is available for country selected"
        responses:
          "200":
            description: "Successfully initialized"
          "400":
            description: "Invalid request parameters"
          "401":
            description: "Unauthorized"
          "500":
            description: "Internal server error"
  /get_age_ranges:
    get:
      x-swagger-router-controller: app.endpoints
      operationId: "get_age_ranges"
      parameters:
        - name: "country"
          required: true
          in: "query"
          schema:
            type: "string"
          example: "UKR"
          description: "Country code in ISO 3166-1 alpha-3 format"
      tags:
        - "Ages"
      summary: "Get all age groups (min in group - max in group) available for the country selected. For use when querying population/migration data."
      responses:
        "200":
          description: "Successfully retrieved age groups"
        "400":
          description: "Invalid request parameters"
        "401":
          description: "Unauthorized"
        "500":
          description: "Internal server error"
  /get_dates:
    get:
      x-swagger-router-controller: app.endpoints
      operationId: "get_dates"
      parameters:
        - name: "country"
          required: true
          in: "query"
          schema:
            type: "string"
          description: "Country code in ISO 3166-1 alpha-3 format"
          example: "UKR"
      tags:
        - "Dates"
      summary: "Get all dates available for the country selected for both migration (dates_migration) and population (dates_pop) queries. For use when querying population/migration data."
      responses:
        "200":
          description: "Successfully retrieved dates"
        "400":
          description: "Invalid request parameters"
        "401":
          description: "Unauthorized"
        "500":
          description: "Internal server error"
  /get_admin_units:
    get:
      x-swagger-router-controller: app.endpoints
      operationId: "get_admin_units"
      parameters:
        - name: "country"
          required: true
          in: "query"
          schema:
            type: "string"
          description: "Country code in ISO 3166-1 alpha-3 format"
        - name: "admin_level"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 1
            maximum: 3
            default: 1
          description: "Level of admin units to retrieve"
      security:
        - {}
        - JWTAuth: []
      tags:
        - "Admin units"
      summary: "Get all admin units in geojson format for the country and admin level selected"
      responses:
        "200":
          description: "Successfully retrieved admin units"
        "400":
          description: "Invalid request parameters"
        "401":
          description: "Unauthorized"
        "500":
          description: "Internal server error"
  /get_population:
    get:
      x-swagger-router-controller: app.endpoints
      operationId: "get_population"
      parameters:
        - name: "country"
          required: true
          in: "query"
          schema:
            type: "string"
          description: "Country code in ISO 3166-1 alpha-3 format"
          example: "UKR"
        - name: "admin_level"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 1
            maximum: 3
            default: 1
          description: "Level of admin units to retrieve"
          example: 1
        - name: "date"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
          description: "Date in YYYY-MM-DD format"
          example: "2024-01-01"
        - name: "admin_id"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Admin unit id"
        - name: "age_min_male"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            default: 0
          description: "Minimum Male"
          example: 0
        - name: "age_max_male"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 999
            default: 999
          description: "Maximum Male"
          example: 999
        - name: "age_min_female"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            default: 0
          description: "Minimum Female"
          example: 0
        - name: "age_max_female"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 999
            default: 999
          description: "Maximum Female"
          example: 999
      security:
        - {}
        - JWTAuth: []
      tags:
        - "Population"
      summary: "Get population data. Responses will be a combination of age/sex groups within ranges and dates available. See /get_ages and /get_dates for available age groups and dates."
      responses:
        "200":
          description: "Successfully retrieved population data"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  population:
                    type: "integer"
                    description: "Total population"
                  breakdown:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        age_group:
                          type: "string"
                          description: "Age group"
                        male:
                          type: "integer"
                          description: "Male population"
                        female:
                          type: "integer"
                          description: "Female population"
              examples:
                example1:
                  summary: "Example response"
                  value:
                    population: 1000000
                    breakdown:
                      - age_group: "0-10"
                        male: 50000
                        female: 48000
                      - age_group: "11-20"
                        male: 52000
                        female: 50000
        "400":
          description: "Bad Request - Invalid parameters"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
                    description: "Error message"
              examples:
                example1:
                  summary: "Invalid date format"
                  value:
                    error: "Invalid date format. Expected YYYY-MM-DD."
        "401":
          description: "Unauthorized - Invalid or missing JWT token"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
                    description: "Error message"
              examples:
                example1:
                  summary: "Missing token"
                  value:
                    error: "JWT token is missing or invalid."
        "404":
          description: "Not Found - No data found for the given parameters"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
                    description: "Error message"
              examples:
                example1:
                  summary: "No data found"
                  value:
                    error: "No population data found for the given parameters."
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
                    description: "Error message"
              examples:
                example1:
                  summary: "Server error"
                  value:
                    error: "An unexpected error occurred."
  /get_migration_probabilities:
      get:
        x-swagger-router-controller: app.endpoints
        operationId: "get_migration_probabilities"
        parameters:
          - name: "country"
            required: true
            in: "query"
            schema:
              type: "string"
            description: "Country code in ISO 3166-1 alpha-3 format"
          - name: "admin_level"
            in: "query"
            required: true
            schema:
              type: "integer"
              minimum: 1
              maximum: 3
              default: 1
            description: "Level of admin units to retrieve"
          - name: "date"
            in: "query"
            required: true
            schema:
              type: "string"
              format: "date"
            description: "Date in YYYY-MM-DD format"
          - name: "admin_id"
            in: "query"
            required: false
            schema:
              type: "string"
            description: "Admin unit id"
          - name: "age_min_male"
            in: "query"
            required: false
            schema:
              type: "integer"
              minimum: 0
              default: 0
            description: "Minimum Male"
          - name: "age_max_male"
            in: "query"
            required: false
            schema:
              type: "integer"
              minimum: 0
              maximum: 999
              default: 999
            description: "Maximum Male"
          - name: "age_min_female"
            in: "query"
            required: false
            schema:
              type: "integer"
              minimum: 0
              default: 0
            description: "Minimum Female"
          - name: "age_max_female"
            in: "query"
            required: false
            schema:
              type: "integer"
              minimum: 0
              maximum: 999
              default: 999
            description: "Maximum Female"
          - name: "rank_by"
            in: "query"
            required: false
            schema:
              type: "string"
              enum: ["count", "probability"]
              default: "count"
            description: "Rank results by count or probability"
          - name: "limit"
            in: "query"
            required: false
            schema:
              type: "integer"
              minimum: 1
              maximum: 25
              default: 10
            description: "Limit the number of results"
        security:
          - {}
          - JWTAuth: []
        tags:
          - "Migration"
        summary: "Get migration probabilities. Responses will be a combination of age groups within ranges and dates available. See /get_ages and /get_dates for available age groups and dates for available age groups."
        responses:
          "200":
            description: "Successfully retrieved migration probabilities"
          "400":
            description: "Invalid request parameters"
          "401":
            description: "Unauthorized"
          "500":
            description: "Internal server error"
  /data_download:
      get:
        x-swagger-router-controller: app.endpoints
        operationId: "data_download"
        parameters:
          - name: "country"
            required: true
            in: "query"
            schema:
              type: "string"
            description: "Country code in ISO 3166-1 alpha-3 format"
          - name: "admin_level"
            in: "query"
            required: true
            schema:
              type: "integer"
              minimum: 1
              maximum: 3
              default: 1
            description: "Level of admin units to retrieve"
          - name: "date_start"
            in: "query"
            required: true
            schema:
              type: "string"
              format: "date"
            description: "Date from in YYYY-MM-DD format"
          - name: "date_end"
            in: "query"
            required: true
            schema:
              type: "string"
              format: "date"
            description: "Date to in YYYY-MM-DD format"
          - name: "age_min"
            in: "query"
            required: true
            schema:
              type: "integer"
              minimum: 0
              default: 0
            description: "Minimum age"
          - name: "age_max"
            in: "query"
            required: true
            schema:
              type: "integer"
              minimum: 0
              maximum: 999
              default: 999
            description: "Maximum age"
          - name: "sex"
            in: "query"
            required: true
            schema:
              type: "string"
              enum: ["both", "male", "female"]
              default: "both"          
          - name: "file_format"
            in: "query"
            required: true
            schema:
              type: "string"
              enum: ["csv", "json"]
              default: "csv"
            description: "File format to download"
        security:
          - {}
          - JWTAuth: []
        tags:
          - "Download"
        summary: "Download data for age/sex selection in admin level/country in dates range."
        responses:
          "200":
            description: "Successfully downloaded data"
          "400":
            description: "Invalid request parameters"
          "401":
            description: "Unauthorized"
          "500":
            description: "Internal server error"            
components:
  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: app.endpoints.decodetoken
